name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Tests read ONLY TEST_DATABASE_URL (points at the throwaway CI Postgres —
      # never a real database). DATABASE_URL is intentionally NOT set job-wide:
      # it's provided only to the migrate step below, so the prod-DB safety guard
      # (which refuses TEST_DATABASE_URL === DATABASE_URL) stays inert during tests.
      TEST_DATABASE_URL: postgres://platform:platform@localhost:5432/platform
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        run: pnpm --filter @platform/db db:migrate
        env:
          DATABASE_URL: postgres://platform:platform@localhost:5432/platform

      - name: Test
        run: pnpm test

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-smoke:
    runs-on: ubuntu-latest
    # Needs Clerk keys to boot the app; enable by setting repo variable E2E_ENABLED=1.
    if: ${{ vars.E2E_ENABLED == '1' }}
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @platform/e2e exec playwright install chromium --with-deps
      - run: pnpm --filter @platform/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      - run: pnpm e2e
        env:
          # E2E_FULL=1 enables the signed-in journeys, including the
          # onboarding redirect-loop regression test. E2E_BUILD=1 runs them
          # against a production build — that test cannot detect the router
          # cache regression under `next dev`.
          E2E_FULL: "1"
          E2E_BUILD: "1"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          REDIS_URL: ${{ secrets.E2E_REDIS_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
